server.port: 8080

spring:
  application.name: api-gateway
  cloud:
    gateway.server.webflux.routes:
      - id: user-service-auth
        uri: lb://USER-SERVICE
        predicates:
          - Path=/api/auth/**

      - id: user-service-protected
        uri: lb://USER-SERVICE
        predicates:
          - Path=/api/users/**
        filters:
          - JwtAuthenticationFilter

      - id: product-service
        uri: lb://PRODUCT-SERVICE
        predicates:
          - Path=/api/products/**
          - Method=POST,PUT,DELETE,PATCH
        filters:
          - name: JwtAuthenticationFilter
            args:
              roles: SELLER,ADMIN

      - id: product-service-get-product
        uri: lb://PRODUCT-SERVICE
        predicates:
          - Path=/api/products/**
          - Method=GET

      - id: product-service-category
        uri: lb://PRODUCT-SERVICE
        predicates:
          - Path=/api/category/**
        filters:
          - name: JwtAuthenticationFilter
            args:
              roles: ADMIN

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt.secret: ${JWT_SECRET}