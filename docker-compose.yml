services:
  postgre:
    image: postgres:14.22-trixie
    environment:
      POSTGRES_DB: smartshop_users
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: pwd
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: